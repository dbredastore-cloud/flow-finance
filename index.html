  --bg: #090d13;
  --s1: #0f1420;
  --s2: #141926;
  --s3: #1a202e;
  --line: #1f2636;

*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

#root{min-height:100vh;}

.lc{width:100%;max-width:390px;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:36px 30px;box-shadow:0 32px 64px rgba(0,0,0,.5);}
.bl{display:flex;align-items:center;gap:10px;}
.bmark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 0 20px var(--glow);}
.bmark svg{width:15px;height:15px;}
.bname{font-family:'Sora';font-size:19px;font-weight:600;letter-spacing:-.02em;}
.bname b{color:var(--brand);}
.lsub{color:var(--dim);font-size:13.5px;margin:18px 0 26px;line-height:1.55;}
.fl{margin-bottom:14px;}
.fl label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:500;}
.fl input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:var(--rsm);color:var(--text);font-size:13.5px;}
.fl input:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--glow);}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#090d13;font-weight:700;border-radius:var(--rsm);font-size:13.5px;}
.btn:hover{filter:brightness(1.07);}

.lerr{background:rgba(245,107,138,.12);border:1px solid rgba(245,107,138,.3);color:#fca5b8;font-size:12.5px;padding:10px 12px;border-radius:var(--rsm);margin-bottom:14px;}
.linfo{background:var(--glow);border:1px solid rgba(0,229,160,.25);color:#6effd0;font-size:12.5px;padding:10px 12px;border-radius:var(--rsm);margin-bottom:14px;line-height:1.5;}
.lnote{font-size:11.5px;color:var(--faint);margin-top:18px;text-align:center;line-height:1.5;}
.llink{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--dim);padding:5px;}

table.et td.r{text-align:right;font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--text);}

table.et tr:last-child td{border-bottom:none;}
table.et tr.tot td{border-top:1px solid var(--line);font-weight:600;color:var(--text);}

.bar-fill{height:4px;border-radius:3px;background:var(--cost);}

</style>

// ---- compute for a period (list of {year,month}) ----
function computePeriod(expenses,revenue,tools,slugs,periods){
  const idSet=new Set(tools.filter(t=>slugs.includes("all")||slugs.includes(t.slug)).map(t=>t.id));
  const pset=new Set(periods.map(p=>`${p.year}-${p.month}`));
  const cost=expenses.filter(e=>idSet.has(e.tool_id)&&pset.has(`${e.year}-${e.month}`)).reduce((s,e)=>s+Number(e.amount),0);
  const revRows=revenue.filter(r=>idSet.has(r.tool_id)&&pset.has(`${r.year}-${r.month}`));
  const rev=revRows.reduce((s,r)=>s+Number(r.faturamento),0);
  const reemb=revRows.reduce((s,r)=>s+Number(r.reembolsos),0);
  const novos=revRows.reduce((s,r)=>s+Number(r.novos_usuarios),0);
  const totais_arr=revRows.map(r=>Number(r.usuarios_totais)).filter(v=>v>0);
  const totais=totais_arr.length?Math.max(...totais_arr):0;
  const net=rev-cost;
  const margin=rev>0?(net/rev)*100:null;
  return{cost,rev,net,margin,reemb,novos,totais,hasData:cost>0||rev>0};
}

function computeToolPeriod(expenses,revenue,tool,periods){
  const pset=new Set(periods.map(p=>`${p.year}-${p.month}`));
  const cost=expenses.filter(e=>e.tool_id===tool.id&&pset.has(`${e.year}-${e.month}`)).reduce((s,e)=>s+Number(e.amount),0);
  const revRows=revenue.filter(r=>r.tool_id===tool.id&&pset.has(`${r.year}-${r.month}`));
  const rev=revRows.reduce((s,r)=>s+Number(r.faturamento),0);
  const reemb=revRows.reduce((s,r)=>s+Number(r.reembolsos),0);
  const novos=revRows.reduce((s,r)=>s+Number(r.novos_usuarios),0);
  const net=rev-cost;
  const margin=rev>0?(net/rev)*100:null;
  return{cost,rev,net,margin,reemb,novos,hasData:cost>0||rev>0};
}

function computeExpBreakdown(expenses,categories,tool,periods){
  const pset=new Set(periods.map(p=>`${p.year}-${p.month}`));
  const cats=categories.filter(c=>c.tool_id===tool.id);
  const rows=cats.map(c=>{
    const amt=expenses.filter(e=>e.tool_id===tool.id&&e.category_id===c.id&&pset.has(`${e.year}-${e.month}`)).reduce((s,e)=>s+Number(e.amount),0);
    return{name:c.name,amt};
  }).filter(r=>r.amt>0).sort((a,b)=>b.amt-a.amt);
  return rows;
}

// generate period list from mode+selection
function buildPeriods(mode,singleY,singleM,rangeFrom,rangeTo){
  if(mode==="single") return [{year:singleY,month:singleM}];
  const periods=[];
  let y=rangeFrom.year,m=rangeFrom.month;
  while(y<rangeTo.year||(y===rangeTo.year&&m<=rangeTo.month)){
    periods.push({year:y,month:m});
    m++;if(m>12){m=1;y++;}
  }
  return periods;
}

    const label=`${MONTHS[p.month-1]}/${String(p.year).slice(2)}`;
    const cost=expenses.filter(e=>e.year===p.year&&e.month===p.month).reduce((s,e)=>s+Number(e.amount),0);
    const rev=revenue.filter(r=>r.year===p.year&&r.month===p.month).reduce((s,r)=>s+Number(r.faturamento),0);
    return{month:label,Receita:rev,Custo:cost,Líquido:rev-cost};
  }),[expenses,revenue,periods]);

  // expense breakdown for selected tool (or all merged)
  const currentTool=viewTool==="all"?null:tools.find(t=>t.slug===viewTool);
  const expBreakdown=useMemo(()=>{
    if(!currentTool) return [];
    return computeExpBreakdown(expenses,cats,currentTool,periods);
  },[expenses,cats,currentTool,periods]);
  const maxExp=expBreakdown.length?expBreakdown[0].amt:1;

  const setMonthInput=(val,setter)=>{const[y,m]=val.split("-").map(Number);setter({year:y,month:m});};

  if(checking)return <div className="loading">Carregando…</div>;
  if(!sb)return <div className="lw"><div className="lc"><Brand/><div className="lsub">Configure SUPABASE_URL e SUPABASE_ANON_KEY.</div></div></div>;
  if(recovery)return <ResetPassword onDone={()=>{setRecovery(false);showToast("Senha redefinida.");}}/>;
  if(!session)return <Login onIn={()=>{}}/>;

  const toMonthVal=(y,m)=>`${y}-${String(m).padStart(2,"0")}`;

  return(
    <>
      <header>
        <Brand/>
        <div className="hright">
          <span className="huser">{session.user.email}</span>
          <button className="hout" onClick={()=>sb.auth.signOut()}>Sair</button>
        </div>
      </header>

      <div className="shell">
        {/* PERIOD BAR */}
        <div className="pbar">
          <div className="pmode">
            <button className={mode==="single"?"on":""} onClick={()=>setMode("single")}>Mês único</button>
            <button className={mode==="range"?"on":""} onClick={()=>setMode("range")}>Intervalo</button>
          </div>
          {mode==="single"?(
            <div className="psel">
              <select value={singleM} onChange={e=>setSingleM(Number(e.target.value))}>
                {MONTHS_F.map((mn,i)=><option key={i} value={i+1}>{mn}</option>)}
              </select>
              <select value={singleY} onChange={e=>setSingleY(Number(e.target.value))}>
                {[2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          ):(
            <div className="psel">
              <input type="month" value={toMonthVal(rangeFrom.year,rangeFrom.month)} onChange={e=>setMonthInput(e.target.value,setRangeFrom)}/>
              <span className="psep">até</span>
              <input type="month" value={toMonthVal(rangeTo.year,rangeTo.month)} onChange={e=>setMonthInput(e.target.value,setRangeTo)}/>
            </div>
          )}
          <div className="sp"/>
          <div className="pill">📅 {periodLabel}</div>
        </div>

        {loading?<div className="loading">Carregando dados…</div>:(
          <>
            {/* KPI ROW */}
            <div className="krow">
              <div className="kcard rev">
                <div className="klabel">Receita</div>
                <div className="kval rv">{fmt(overall.rev)}</div>
                <div className="ksub">{periods.length} {periods.length===1?"mês":"meses"} · {overall.novos} novos usuários</div>
              </div>
              <div className="kcard cost">
                <div className="klabel">Custo total</div>
                <div className="kval ct">{fmt(overall.cost)}</div>
                <div className="ksub">despesas somadas</div>
              </div>
              <div className="kcard net">
                <div className="klabel">Líquido</div>
                <div className={"kval "+(overall.net>=0?"pos":"neg")}>{fmt(overall.net)}</div>
                <div className="ksub">receita − custo</div>
              </div>
              <div className="kcard mrg">
                <div className="klabel">Margem líquida</div>
                <div className={"kval "+(overall.margin>=0?"pos":"neg")}>{pct(overall.margin)}</div>
                <div className="ksub">{overall.reemb} reembolsos no período</div>
              </div>
            </div>

            {/* KANBAN */}
            <div className="kanban">
              {perTool.map(({tool,cost,rev,net,margin,reemb,novos,hasData})=>(
                <div className="kancol" key={tool.id} onClick={()=>setViewTool(viewTool===tool.slug?"all":tool.slug)}
                  style={{cursor:"pointer",outline:viewTool===tool.slug?`2px solid ${TCOL[tool.slug]||"#888"}`:"none",outlineOffset:"-1px"}}>
                  <div className="kanhdr">
                    <div className="kandot" style={{background:TCOL[tool.slug]||"#888",boxShadow:`0 0 8px ${TCOL[tool.slug]||"#888"}`}}/>
                    <div className="kantool">{tool.name}</div>
                  </div>
                  <div className="kanbody">
                    {!hasData?<div className="nodata">Sem dados no período</div>:(
                      <>
                        <div className="kanitem">
                          <div className="kanitem-label">RECEITA</div>
                          <div className="kanitem-val rv">{fmtK(rev)}</div>
                        </div>
                        <div className="kanitem">
                          <div className="kanitem-label">CUSTO</div>
                          <div className="kanitem-val ct">{fmtK(cost)}</div>
                        </div>
                        <div className="kanitem">
                          <div className="kanitem-label">LÍQUIDO</div>
                          <div className={"kanitem-val "+(net>=0?"pos":"neg")}>{fmtK(net)}</div>
                        </div>
                      </>
                    )}
                  </div>
                  {hasData&&(
                    <div className="kanfooter">
                      <span className="klabel">Margem</span>
                      <span className="kval2" style={{color:margin>=0?"var(--brand)":"var(--cost)"}}>{pct(margin)}</span>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* BOTTOM: chart + expense breakdown */}
            <div className="bgrid">
              {/* CHART */}
              <div className="panel">
                <div className="ph rh">
                  <div className="ptitle">Receita vs Custo {periods.length>1?"mensal":periodLabel}</div>
                  <div className="phint">clique no kanban para filtrar</div>
                </div>
                <div className="cpanel">
                  {!R||chartData.length===0?<div className="empty">Sem dados no período.</div>:(
                    <>
                    <R.ResponsiveContainer width="100%" height={240}>
                      <R.ComposedChart data={chartData} margin={{top:6,right:8,left:2,bottom:0}}>
                        <R.CartesianGrid strokeDasharray="3 3" stroke="#1a2030" vertical={false}/>
                        <R.XAxis dataKey="month" stroke="#4a5568" fontSize={11} tickLine={false} axisLine={false}/>
                        <R.YAxis stroke="#4a5568" fontSize={11} tickLine={false} axisLine={false} tickFormatter={v=>fmtK(v)} width={52}/>
                        <R.Tooltip contentStyle={{background:"#141926",border:"1px solid #1f2636",borderRadius:8,fontSize:12}} labelStyle={{color:"#e8edf5",fontWeight:600}} formatter={v=>fmt(v)}/>
                        <R.Bar dataKey="Receita" fill="#38b2f8" radius={[3,3,0,0]} maxBarSize={28}/>
                        <R.Bar dataKey="Custo" fill="#f56b8a" radius={[3,3,0,0]} maxBarSize={28}/>
                        <R.Line dataKey="Líquido" stroke="#a78bfa" strokeWidth={2.5} dot={{r:3,fill:"#a78bfa"}} type="monotone"/>
                      </R.ComposedChart>
                    </R.ResponsiveContainer>
                    <div className="legend">
                      <span><i style={{background:"#38b2f8"}}/>Receita</span>
                      <span><i style={{background:"#f56b8a"}}/>Custo</span>
                      <span><i style={{background:"#a78bfa"}}/>Líquido</span>
                    </div>
                    </>
                  )}
                </div>
              </div>

              {/* EXPENSE BREAKDOWN */}
              <div className="panel">
                <div className="ph ch">
                  <div className="ptitle">Despesas{currentTool?` · ${currentTool.name}`:""}</div>
                  <div className="phint">{currentTool?"clique no kanban para mudar":"selecione uma ferramenta"}</div>
                </div>
                {!currentTool?(
                  <div className="empty">Clique em uma ferramenta no kanban acima para ver o detalhamento de despesas.</div>
                ):expBreakdown.length===0?(
                  <div className="empty">Sem despesas no período.</div>
                ):(
                  <table className="et">
                    <thead><tr><th>Categoria</th><th className="r">Valor</th><th className="r">%</th><td className="bar"/></tr></thead>
                    <tbody>
                      {expBreakdown.map((r,i)=>{
                        const total=expBreakdown.reduce((s,x)=>s+x.amt,0);
                        const pctVal=total>0?(r.amt/total*100):0;
                        return(
                          <tr key={i}>
                            <td>{r.name}</td>
                            <td className="r">{fmt(r.amt)}</td>
                            <td className="r" style={{color:"var(--dim)"}}>{pctVal.toFixed(1)}%</td>
                            <td className="bar"><div className="bar-track"><div className="bar-fill" style={{width:`${(r.amt/maxExp)*100}%`}}/></div></td>
                          </tr>
                        );
                      })}
                      <tr className="tot">
                        <td>Total</td>
                        <td className="r" style={{color:"var(--cost)"}}>{fmt(expBreakdown.reduce((s,r)=>s+r.amt,0))}</td>
                        <td className="r">100%</td>
                        <td className="bar"/>
                      </tr>
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </>
        )}
      </div>
      {toast&&<div className={"toast "+toast.kind}>{toast.msg}</div>}
    </>
  );
}

try{ReactDOM.createRoot(document.getElementById("root")).render(<App/>);}
catch(err){
  document.getElementById("root").innerHTML=
    '<div style="max-width:420px;margin:80px auto;padding:24px;font-family:Inter,sans-serif;color:#e8edf5;background:#0f1420;border:1px solid #1f2636;border-radius:12px;">'
    +'<h2 style="margin:0 0 8px;font-family:Sora,serif;">Flow Finance</h2>'
    +'<p style="color:#8892a4;font-size:14px;line-height:1.6;">Erro ao iniciar. Recarregue a página.</p>'
    +'<p style="color:#4a5568;font-size:12px;margin-top:10px;">'+( err&&err.message?err.message:err)+'</p></div>';
}
</script>
</body>
</html>
