<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const { createClient } = supabase;
const R = (typeof Recharts !== "undefined") ? Recharts : null;
const HAS_CHARTS = R !== null;

const MONTHS = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const TOOL_COLORS = { flowpages: "#3ba9f4", flowtracking: "#9d8cf5", flowspy: "#37e0a0", flowsubscriptions: "#f5b544" };

const fmt = (v) => { if (v==null||isNaN(v)) return "—"; return "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const fmtNum = (v) => Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt = (v) => v==null||isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR");
const num = (v) => { if (v===""||v==null) return 0; const n=parseFloat(String(v).replace(/\./g,"").replace(",",".")); return isNaN(n)?0:n; };

const isConfigured = () => window.FLOW_CONFIG.SUPABASE_URL.startsWith("http") && window.FLOW_CONFIG.SUPABASE_ANON_KEY.length > 20;
let sb = null;

function Login({ onIn }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState(""); const [pw, setPw] = useState("");
  const [err, setErr] = useState(""); const [info, setInfo] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async () => {
    setErr(""); setBusy(true);

  const sendReset = async () => {
    setErr(""); setInfo(""); setBusy(true);

  if (mode === "forgot") return (

      <div className="field"><label>E-mail</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendReset()} placeholder="voce@empresa.com"/></div>

      <button className="link-btn" onClick={()=>{setMode("login");setErr("");setInfo("");}}>← Voltar para o login</button>

function ResetPassword({ onDone }) {
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const save = async () => {
    setErr("");
    if (pw.length<6){setErr("A senha precisa ter pelo menos 6 caracteres.");return;}
    if (pw!==pw2){setErr("As duas senhas não são iguais.");return;}
    setBusy(true); const { error } = await sb.auth.updateUser({ password: pw }); setBusy(false);
    if (error) setErr("Não foi possível salvar. O link pode ter expirado, peça um novo."); else onDone();
  };
  return (
    <div className="login-wrap"><div className="login-card">
      <div className="brand-lockup"><FlowMark/><div className="brand-name">Flow <b>Finance</b></div></div>
      <div className="login-sub">Defina sua nova senha.</div>
      {err && <div className="login-err">{err}</div>}
      <div className="field"><label>Nova senha</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"/></div>
      <div className="field"><label>Confirme a nova senha</label><input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} placeholder="••••••••"/></div>
      <button className="btn-primary" onClick={save} disabled={busy||!pw||!pw2}>{busy?"Salvando…":"Salvar nova senha"}</button>
    </div></div>
  );
}

function computeMetrics(expenses, revenue, tools, filterSlug, year) {
  const idSet = new Set(tools.filter(t => filterSlug==="all" || t.slug===filterSlug).map(t=>t.id));
  const monthly = MONTHS.map((_,i)=>{
    const m=i+1;
    const cost = expenses.filter(e=>e.year===year&&e.month===m&&idSet.has(e.tool_id)).reduce((s,e)=>s+Number(e.amount),0);
    const revRows = revenue.filter(r=>r.year===year&&r.month===m&&idSet.has(r.tool_id));
    const rev = revRows.reduce((s,r)=>s+Number(r.faturamento),0);
    const novos = revRows.reduce((s,r)=>s+Number(r.novos_usuarios),0);
    const totais = revRows.reduce((s,r)=>s+Number(r.usuarios_totais),0);
    const reemb = revRows.reduce((s,r)=>s+Number(r.reembolsos),0);
    return { month:MONTHS[i], m, revenue:rev, cost, net:rev-cost, novos, totais, reembolsos:reemb, hasData: cost>0||rev>0||revRows.length>0 };
  });
  const active = monthly.filter(x=>x.hasData);
  const totRev = active.reduce((s,x)=>s+x.revenue,0);
  const totCost = active.reduce((s,x)=>s+x.cost,0);
  const totNet = totRev-totCost;
  return { monthly, active, totRev, totCost, totNet, margin: totRev>0?(totNet/totRev)*100:null };
}

    setLoading(true);
    const [t,c,e,r] = await Promise.all([
      sb.from("tools").select("*").order("sort_order"),
      sb.from("expense_categories").select("*"),
      sb.from("monthly_expenses").select("*"),
      sb.from("monthly_revenue").select("*"),
    ]);
    setTools(t.data||[]); setCategories(c.data||[]); setExpenses(e.data||[]); setRevenue(r.data||[]); setLoading(false);
  }, []);
  useEffect(() => { if (session) loadAll(); }, [session, loadAll]);

  const years = useMemo(() => {
    const ys = new Set([2025,2026]); expenses.forEach(e=>ys.add(e.year)); revenue.forEach(r=>ys.add(r.year));
    return [...ys].sort((a,b)=>b-a);
  }, [expenses, revenue]);
  const metrics = useMemo(()=>computeMetrics(expenses,revenue,tools,view,year),[expenses,revenue,tools,view,year]);
  const perToolSeries = useMemo(()=>tools.map(t=>({tool:t,...computeMetrics(expenses,revenue,tools,t.slug,year)})),[expenses,revenue,tools,year]);

  const saveExpense = async (tool_id, category_id, y, m, amount) => {
    setExpenses(prev => {
      const idx = prev.findIndex(e=>e.tool_id===tool_id&&e.category_id===category_id&&e.year===y&&e.month===m);
      if (idx>=0){const cp=[...prev];cp[idx]={...cp[idx],amount};return cp;}
      return [...prev,{id:`tmp-${tool_id}-${category_id}-${y}-${m}`,tool_id,category_id,year:y,month:m,amount}];
    });
    const { error } = await sb.from("monthly_expenses").upsert({tool_id,category_id,year:y,month:m,amount},{onConflict:"tool_id,category_id,year,month"});
    if (error){showToast("Erro ao salvar.","err");loadAll();}
  };
  const saveRevenue = async (tool_id, y, m, field, value) => {
    const existing = revenue.find(r=>r.tool_id===tool_id&&r.year===y&&r.month===m) || {faturamento:0,reembolsos:0,novos_usuarios:0,usuarios_totais:0};
    setRevenue(prev => {
      const idx = prev.findIndex(r=>r.tool_id===tool_id&&r.year===y&&r.month===m);
      if (idx>=0){const cp=[...prev];cp[idx]={...cp[idx],[field]:value};return cp;}
      const base={id:`tmp-${tool_id}-${y}-${m}`,tool_id,year:y,month:m,faturamento:0,reembolsos:0,novos_usuarios:0,usuarios_totais:0};
      base[field]=value; return [...prev,base];
    });
    const payload = { tool_id, year:y, month:m, faturamento:existing.faturamento, reembolsos:existing.reembolsos, novos_usuarios:existing.novos_usuarios, usuarios_totais:existing.usuarios_totais };
    payload[field]=value;
    const { error } = await sb.from("monthly_revenue").upsert(payload,{onConflict:"tool_id,year,month"});
    if (error){showToast("Erro ao salvar.","err");loadAll();}
  };
  const addCategory = async (tool_id, name) => {
    const { error } = await sb.from("expense_categories").insert({tool_id,name});
    if (error) showToast("Categoria já existe ou erro.","err"); else { showToast("Categoria criada."); loadAll(); }
    setAddCatOpen(false);
  };

  if (checking) return <div className="loading">Carregando…</div>;
  if (!sb) return <ConfigScreen/>;
  if (recovery) return <ResetPassword onDone={()=>{setRecovery(false);showToast("Senha redefinida.");}}/>;
  if (!session) return <Login onIn={()=>{}}/>;

  const currentTool = view==="all" ? null : tools.find(t=>t.slug===view);

  return (
    <>
      <header className="top">
        <div className="brand-lockup"><FlowMark/><div className="brand-name">Flow <b>Finance</b></div></div>
        <div className="top-right"><span className="top-user">{session.user.email}</span>
          <button className="top-logout" onClick={()=>sb.auth.signOut()}>Sair</button></div>
      </header>
      <div className="shell">
        <div className="controls">
          <div className="tabs">
            <button className={view==="all"?"on":""} onClick={()=>setView("all")}>Consolidado</button>
            {tools.map(t=><button key={t.id} className={view===t.slug?"on tool":""} onClick={()=>setView(t.slug)}>{t.name}</button>)}
          </div>
          <div className="spacer"></div>
          <select className="yr-select" value={year} onChange={e=>setYear(Number(e.target.value))}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        </div>
        {loading ? <div className="loading">Carregando dados…</div> : (
          <>
            <KpiRow m={metrics}/>
            <ChartPanel m={metrics} year={year}/>
            {view==="all"
              ? <ConsolidatedView perTool={perToolSeries} expenses={expenses} revenue={revenue} year={year}/>
              : <ToolView tool={currentTool} categories={categories} expenses={expenses} revenue={revenue} year={year} m={metrics} saveExpense={saveExpense} saveRevenue={saveRevenue} onAddCat={()=>setAddCatOpen(true)}/>}
          </>
        )}
      </div>
      {addCatOpen && currentTool && <AddCategoryModal tool={currentTool} onClose={()=>setAddCatOpen(false)} onAdd={addCategory}/>}
      {toast && <div className={"toast "+toast.kind}>{toast.msg}</div>}
    </>
  );
}

function ConfigScreen() {
  return (<div className="login-wrap"><div className="login-card">
    <div className="brand-lockup"><FlowMark/><div className="brand-name">Flow <b>Finance</b></div></div>
    <div className="login-sub">Falta configurar a conexão.</div>
    <div className="config-warn">Preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> no <code>index.html</code>.</div>
  </div></div>);
}

function KpiRow({ m }) {
  const marginTxt = m.margin==null?"—":m.margin.toFixed(1)+"%";
  return (
    <div className="kpi-row">
      <div className="kpi rev"><div className="kpi-top"><span className="kpi-dot"></span><span className="kpi-label">Receita no período</span></div><div className="kpi-value">{fmt(m.totRev)}</div><div className="kpi-sub">{m.active.length} {m.active.length===1?"mês":"meses"} com dados</div></div>
      <div className="kpi cost"><div className="kpi-top"><span className="kpi-dot"></span><span className="kpi-label">Custo no período</span></div><div className="kpi-value">{fmt(m.totCost)}</div><div className="kpi-sub">despesas + infraestrutura</div></div>
      <div className="kpi net"><div className="kpi-top"><span className="kpi-dot"></span><span className="kpi-label">Líquido</span></div><div className={"kpi-value "+(m.totNet>=0?"pos":"neg")}>{fmt(m.totNet)}</div><div className="kpi-sub">receita menos custo</div></div>
      <div className="kpi mrg"><div className="kpi-top"><span className="kpi-dot"></span><span className="kpi-label">Margem líquida</span></div><div className={"kpi-value "+(m.margin>=0?"pos":"neg")}>{marginTxt}</div><div className="kpi-sub">líquido / receita</div></div>
    </div>
  );
}

function ChartPanel({ m, year }) {
  const data = m.active.map(x=>({month:x.month,Receita:x.revenue,Custo:x.cost,"Líquido":x.net}));
  return (
    <div className="panel">
      <div className="panel-head"><div className="panel-title">Receita, custo e líquido · {year}</div></div>
      {!HAS_CHARTS ? <div className="empty">Gráfico indisponível. Os dados e a grade continuam funcionando.</div> :
       data.length===0 ? <div className="empty">Sem dados lançados para {year}.</div> : (
        <>
        <div style={{padding:"18px 12px 0"}}>
        <R.ResponsiveContainer width="100%" height={300}>
          <R.ComposedChart data={data} margin={{top:8,right:12,left:8,bottom:0}}>
            <R.CartesianGrid strokeDasharray="3 3" stroke="#20242e" vertical={false}/>
            <R.XAxis dataKey="month" stroke="#626b7a" fontSize={12} tickLine={false} axisLine={{stroke:"#262b36"}}/>
            <R.YAxis stroke="#626b7a" fontSize={12} tickLine={false} axisLine={false} tickFormatter={v=>(v/1000)+"k"} width={46}/>
            <R.Tooltip contentStyle={{background:"#171b24",border:"1px solid #262b36",borderRadius:9,fontSize:13}} labelStyle={{color:"#eef1f6",fontWeight:600}} formatter={v=>fmt(v)}/>
            <R.Bar dataKey="Receita" fill="#3ba9f4" radius={[3,3,0,0]} maxBarSize={30}/>
            <R.Bar dataKey="Custo" fill="#f6708f" radius={[3,3,0,0]} maxBarSize={30}/>
            <R.Line dataKey="Líquido" stroke="#9d8cf5" strokeWidth={2.5} dot={{r:3,fill:"#9d8cf5"}}/>
          </R.ComposedChart>
        </R.ResponsiveContainer>
        </div>
        <div className="chart-legend"><span><i style={{background:"#3ba9f4"}}></i>Receita</span><span><i style={{background:"#f6708f"}}></i>Custo</span><span><i style={{background:"#9d8cf5"}}></i>Líquido</span></div>
        </>
      )}
    </div>
  );
}

function MoneyCell({ value, onSave }) {
  const [editing, setEditing] = useState(false); const [draft, setDraft] = useState(""); const [saving, setSaving] = useState(false); const ref = useRef();
  const display = value>0 ? fmtNum(value) : "";
  const start = () => { setDraft(value>0?String(value).replace(".",","):""); setEditing(true); };
  useEffect(()=>{ if(editing&&ref.current){ref.current.focus();ref.current.select();} },[editing]);
  const commit = async () => { const parsed=num(draft); setEditing(false); if (parsed!==Number(value)){setSaving(true);await onSave(parsed);setSaving(false);} };
  if (editing) return <input ref={ref} className="cell-input" value={draft} onChange={e=>setDraft(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape")setEditing(false);}}/>;
  return <div className={"cell-input "+(value>0?"":"empty")+(saving?" saving":"")} onClick={start} tabIndex={0} onFocus={start} role="button">{display||"·"}</div>;
}
function IntCell({ value, onSave }) {
  const [editing, setEditing] = useState(false); const [draft, setDraft] = useState(""); const ref = useRef();
  const start = () => { setDraft(value>0?String(value):""); setEditing(true); };
  useEffect(()=>{ if(editing&&ref.current){ref.current.focus();ref.current.select();} },[editing]);
  const commit = async () => { const p=parseInt(draft,10)||0; setEditing(false); if(p!==Number(value)) await onSave(p); };
  if (editing) return <input ref={ref} className="cell-input" value={draft} onChange={e=>setDraft(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape")setEditing(false);}}/>;
  return <div className={"cell-input "+(value>0?"":"empty")} onClick={start} tabIndex={0} onFocus={start} role="button">{value>0?fmtInt(value):"·"}</div>;
}

function ToolView({ tool, categories, expenses, revenue, year, m, saveExpense, saveRevenue, onAddCat }) {
  if (!tool) return null;
  const cats = categories.filter(c=>c.tool_id===tool.id);
  const expMap = {}; expenses.filter(e=>e.tool_id===tool.id&&e.year===year).forEach(e=>{expMap[`${e.category_id}-${e.month}`]=Number(e.amount);});
  const revMap = {}; revenue.filter(r=>r.tool_id===tool.id&&r.year===year).forEach(r=>{revMap[r.month]=r;});
  const catTotal = (id)=>MONTHS.reduce((s,_,i)=>s+(expMap[`${id}-${i+1}`]||0),0);
  const monthExpTotal = (mo)=>cats.reduce((s,c)=>s+(expMap[`${c.id}-${mo}`]||0),0);
  const grandExp = cats.reduce((s,c)=>s+catTotal(c.id),0);
  const revFields = [
    {key:"faturamento",label:"Faturamento",money:true},
    {key:"novos_usuarios",label:"Novos usuários",money:false},
    {key:"usuarios_totais",label:"Usuários totais",money:false},
    {key:"reembolsos",label:"Reembolsos",money:false},
  ];
  return (
    <>
      <div className="panel">
        <div className="panel-head cost-head"><div className="panel-title">Despesas · {tool.name}</div><div className="panel-hint">clique numa célula para editar · {year}</div></div>
        <div className="panel-body flush">
          <div className="grid-scroll"><table className="grid">
            <thead><tr><th className="cat-col">Categoria</th>{MONTHS.map(mo=><th key={mo}>{mo}</th>)}<th className="tot-col">Total</th></tr></thead>
            <tbody>
              {cats.map(c=>(
                <tr key={c.id}>
                  <td className="cat-cell">{c.name}</td>
                  {MONTHS.map((_,i)=><td key={i}><MoneyCell value={expMap[`${c.id}-${i+1}`]||0} onSave={(v)=>saveExpense(tool.id,c.id,year,i+1,v)}/></td>)}
                  <td className="tot-cell">{catTotal(c.id)>0?fmt(catTotal(c.id)):"·"}</td>
                </tr>
              ))}
              {cats.length===0 && <tr><td className="cat-cell" colSpan={14} style={{textAlign:"center",padding:"30px",color:"var(--text-faint)"}}>Nenhuma categoria ainda. Adicione uma abaixo.</td></tr>}
              {cats.length>0 && (
                <tr className="total-row">
                  <td className="cat-cell">Total despesas</td>
                  {MONTHS.map((_,i)=><td key={i} style={{textAlign:"right",paddingRight:11}}>{monthExpTotal(i+1)>0?fmtNum(monthExpTotal(i+1)):"·"}</td>)}
                  <td style={{color:"var(--cost)"}}>{fmt(grandExp)}</td>
                </tr>
              )}
            </tbody>
          </table></div>
          <button className="add-cat-btn" onClick={onAddCat}>+ adicionar categoria de despesa</button>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head rev-head"><div className="panel-title">Receita e usuários · {tool.name}</div><div className="panel-hint">clique numa célula para editar · {year}</div></div>
        <div className="panel-body flush">
          <div className="grid-scroll"><table className="grid">
            <thead><tr><th className="cat-col">Indicador</th>{MONTHS.map(mo=><th key={mo}>{mo}</th>)}<th className="tot-col">Total / Últ.</th></tr></thead>
            <tbody>
              {revFields.map(f=>{
                const total = f.key==="usuarios_totais"
                  ? (()=>{let last=0;MONTHS.forEach((_,i)=>{const r=revMap[i+1];if(r&&Number(r[f.key])>0)last=Number(r[f.key]);});return last;})()
                  : MONTHS.reduce((s,_,i)=>{const r=revMap[i+1];return s+(r?Number(r[f.key]):0);},0);
                return (
                  <tr key={f.key}>
                    <td className="cat-cell">{f.label}</td>
                    {MONTHS.map((_,i)=>{ const r=revMap[i+1]; const val=r?Number(r[f.key]):0;
                      return <td key={i}>{f.money ? <MoneyCell value={val} onSave={(v)=>saveRevenue(tool.id,year,i+1,f.key,v)}/> : <IntCell value={val} onSave={(v)=>saveRevenue(tool.id,year,i+1,f.key,v)}/>}</td>; })}
                    <td className="tot-cell">{f.money?(total>0?fmt(total):"·"):(total>0?fmtInt(total):"·")}</td>
                  </tr>
                );
              })}
              <tr className="total-row">
                <td className="cat-cell">Líquido do mês</td>
                {MONTHS.map((_,i)=>{ const r=revMap[i+1]; const fat=r?Number(r.faturamento):0; const net=fat-monthExpTotal(i+1); const has=fat>0||monthExpTotal(i+1)>0;
                  return <td key={i} style={{textAlign:"right",paddingRight:11,color:net>=0?"var(--brand)":"var(--cost)"}}>{has?fmtNum(net):"·"}</td>; })}
                <td style={{color:m.totNet>=0?"var(--brand)":"var(--cost)"}}>{fmt(m.totNet)}</td>
              </tr>
            </tbody>
          </table></div>
        </div>
      </div>
    </>
  );
}

function ConsolidatedView({ perTool, expenses, revenue, year }) {
  const totals = perTool.reduce((a,p)=>({rev:a.rev+p.totRev,cost:a.cost+p.totCost,net:a.net+p.totNet}),{rev:0,cost:0,net:0});
  const consMonthly = MONTHS.map((_,i)=>{ const m=i+1;
    const cost = expenses.filter(e=>e.year===year&&e.month===m).reduce((s,e)=>s+Number(e.amount),0);
    const rev = revenue.filter(r=>r.year===year&&r.month===m).reduce((s,r)=>s+Number(r.faturamento),0);
    return { m, cost, rev, net:rev-cost };
  });
  return (
    <>
      <div className="panel">
        <div className="panel-head"><div className="panel-title">Resumo por ferramenta</div><div className="panel-hint">acumulado de {year}</div></div>
        <div className="panel-body flush"><div className="grid-scroll"><table className="grid">
          <thead><tr><th className="cat-col">Ferramenta</th><th>Receita</th><th>Custo</th><th>Líquido</th><th className="tot-col">Margem</th></tr></thead>
          <tbody>
            {perTool.map(p=>(
              <tr key={p.tool.id}>
                <td className="cat-cell"><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:TOOL_COLORS[p.tool.slug]||"#888",marginRight:9,verticalAlign:"middle"}}></span>{p.tool.name}</td>
                <td style={{padding:"9px 12px",fontFamily:"'JetBrains Mono'",fontSize:12}}>{p.totRev>0?fmt(p.totRev):"·"}</td>
                <td style={{padding:"9px 12px",fontFamily:"'JetBrains Mono'",fontSize:12}}>{p.totCost>0?fmt(p.totCost):"·"}</td>
                <td style={{padding:"9px 12px",fontFamily:"'JetBrains Mono'",fontSize:12,color:p.totNet>=0?"var(--brand)":"var(--cost)"}}>{(p.totRev>0||p.totCost>0)?fmt(p.totNet):"·"}</td>
                <td className="tot-cell">{p.margin==null?"·":p.margin.toFixed(1)+"%"}</td>
              </tr>
            ))}
            <tr className="total-row"><td className="cat-cell">Total</td><td>{fmt(totals.rev)}</td><td>{fmt(totals.cost)}</td><td style={{color:totals.net>=0?"var(--brand)":"var(--cost)"}}>{fmt(totals.net)}</td><td>{totals.rev>0?((totals.net/totals.rev)*100).toFixed(1)+"%":"·"}</td></tr>
          </tbody>
        </table></div></div>
      </div>

      <div className="panel">
        <div className="panel-head"><div className="panel-title">Mês a mês · consolidado</div><div className="panel-hint">todas as ferramentas · {year}</div></div>
        <div className="panel-body flush"><div className="grid-scroll"><table className="grid">
          <thead><tr><th className="cat-col">Linha</th>{MONTHS.map(mo=><th key={mo}>{mo}</th>)}<th className="tot-col">Total</th></tr></thead>
          <tbody>
            <tr><td className="cat-cell">Receita</td>{consMonthly.map((x,i)=><td key={i} style={{padding:"9px 11px",textAlign:"right",fontFamily:"'JetBrains Mono'",fontSize:11.5,color:"var(--revenue)"}}>{x.rev>0?fmtNum(x.rev):"·"}</td>)}<td className="tot-cell" style={{color:"var(--revenue)"}}>{fmt(consMonthly.reduce((s,x)=>s+x.rev,0))}</td></tr>
            <tr><td className="cat-cell">Custo</td>{consMonthly.map((x,i)=><td key={i} style={{padding:"9px 11px",textAlign:"right",fontFamily:"'JetBrains Mono'",fontSize:11.5,color:"var(--cost)"}}>{x.cost>0?fmtNum(x.cost):"·"}</td>)}<td className="tot-cell" style={{color:"var(--cost)"}}>{fmt(consMonthly.reduce((s,x)=>s+x.cost,0))}</td></tr>
            <tr className="total-row"><td className="cat-cell">Líquido</td>{consMonthly.map((x,i)=>{const has=x.rev>0||x.cost>0;return <td key={i} style={{textAlign:"right",paddingRight:11,color:x.net>=0?"var(--brand)":"var(--cost)"}}>{has?fmtNum(x.net):"·"}</td>;})}<td style={{color:totals.net>=0?"var(--brand)":"var(--cost)"}}>{fmt(totals.net)}</td></tr>
          </tbody>
        </table></div></div>
      </div>
    </>
  );
}

function AddCategoryModal({ tool, onClose, onAdd }) {
  const [name, setName] = useState("");
  return (
    <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-head"><h3>Nova categoria · {tool.name}</h3><button className="modal-x" onClick={onClose}>×</button></div>
      <div className="modal-body"><div className="field"><label>Nome da categoria de despesa</label>
        <input autoFocus value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&name.trim()&&onAdd(tool.id,name.trim())} placeholder="Ex.: Servidor, OpenAI, Suporte" style={{width:"100%",padding:"11px 13px",background:"var(--bg)",border:"1px solid var(--line)",borderRadius:"var(--r-sm)",color:"var(--text)",fontSize:14}}/></div></div>
      <div className="modal-foot"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn-primary" style={{width:"auto",padding:"10px 20px"}} disabled={!name.trim()} onClick={()=>onAdd(tool.id,name.trim())}>Criar</button></div>
    </div></div>
  );
}

    '<h2 style="margin:0 0 8px;font-family:Sora,serif;">Flow Finance</h2>' +

    '<p style="color:#626b7a;font-size:12px;margin-top:12px;">Detalhe: ' + (err&&err.message?err.message:err) + '</p></div>';
}
